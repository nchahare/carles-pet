<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carles Animation Lab</title>
<style>
  :root {
    --bg: #f6f4f0; --panel: #ffffff; --ink: #1d1b18; --muted: #6f6a62; --line: #e3ded6;
    --accent: #C2477F; --chip: #f1ece4; --stage: #efe9df; --floor: #ddd5c8;
    --grid1: rgba(0,0,0,0.06); --grid2: rgba(0,0,0,0.14); --sym: #2a2622;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #201f1c; --ink: #ece8e1; --muted: #9a948a; --line: #34312c;
      --chip: #2a2824; --stage: #24221f; --floor: #2f2c28;
      --grid1: rgba(255,255,255,0.05); --grid2: rgba(255,255,255,0.12); --sym: #e8e2d8;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
  @media (max-width: 1050px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
  h2:first-child { margin-top: 0; }
  .anim-btn { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--ink); padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  .anim-btn:hover { background: var(--chip); }
  .anim-btn.active { background: var(--accent); color: #fff; }
  .anim-btn .tag { font-size: 11px; opacity: .7; }
  .anim-btn:disabled { color: var(--muted); cursor: default; opacity: .6; }
  .anim-btn:disabled:hover { background: transparent; }
  #stage { width: 100%; height: 360px; display: block; border-radius: 8px; image-rendering: pixelated; cursor: grab; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; }
  .controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  button.ctl { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font: inherit; min-width: 36px; }
  button.ctl:hover { border-color: var(--accent); }
  select, input[type=color] { font: inherit; background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  input[type=color] { padding: 0 2px; width: 36px; height: 28px; }
  .info { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .info b { color: var(--ink); }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; }
  .strip figure { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .strip canvas { display: block; background: var(--stage); border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .strip canvas.on { border-color: var(--accent); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .thumb { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; text-align: center; }
  .thumb.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .thumb canvas { width: 100%; height: 120px; display: block; background: var(--stage); border-radius: 5px; image-rendering: pixelated; }
  .thumb div { font-size: 12px; margin-top: 4px; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
  section.wide { padding: 0 20px 24px; }
  .sheet-row { margin-bottom: 14px; }
</style>
</head>
<body>
<header>
  <h1>Carles · Animation Lab</h1>
  <span>Every frame is drawn in code from coloured blocks.</span>
</header>

<div class="layout" id="lab">
  <nav class="panel" id="list"></nav>

  <main>
    <div class="panel">
      <canvas id="stage"></canvas>
      <div class="controls">
        <button class="ctl" id="play" title="Play / pause (Space)">⏸</button>
        <button class="ctl" id="back" title="Previous frame (←)">⏮</button>
        <button class="ctl" id="fwd" title="Next frame (→)">⏭</button>
        <button class="ctl" id="restart" title="Restart (R)">↺</button>
        <label><input type="checkbox" id="loop" checked> Loop</label>
        <label>Speed <input type="range" id="speed" min="0.25" max="2" step="0.25" value="1"> <span id="speedVal">1×</span></label>
        <label>Size <select id="size"><option value="4">S</option><option value="6" selected>M</option><option value="8">L</option><option value="10">XL</option></select></label>
        <label>Colour <input type="color" id="color" value="#E86AA0"></label>
        <label><input type="checkbox" id="grid"> Block grid</label>
        <button class="ctl" id="face" title="Flip facing (F)">Facing →</button>
      </div>
      <div class="info" id="info"></div>
      <h2 style="margin-top:14px">Frames of this animation</h2>
      <div class="strip" id="strip"></div>
      <p class="hint">Keys: <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> step frames · <kbd>↑</kbd><kbd>↓</kbd> previous/next animation · <kbd>G</kbd> grid · <kbd>F</kbd> flip · <kbd>R</kbd> restart</p>
    </div>
  </main>

</div>

<section class="wide">
  <h2>All animations</h2>
  <div class="gallery" id="gallery"></div>
</section>

<section class="wide" id="sheet" hidden></section>

<script src="carles.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const C = Carles;

const state = {
  anim: C.ANIMS.find((a) => a.id === params.get('anim')) || C.ANIMS[0],
  t: +params.get('t') || 0, playing: params.get('paused') !== '1',
  loop: true, speed: 1, size: +params.get('size') || 6, grid: params.get('grid') === '1',
  facing: 1, color: C.PALETTE.o, worldX: 0, dir: 1, gt: 0,
};

let theme = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['stage', 'floor', 'grid1', 'grid2', 'sym']) theme[k] = cs.getPropertyValue('--' + k).trim();
}
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); buildStrip(); });

const dpr = () => window.devicePixelRatio || 1;
const pal = () => ({ o: state.color, i: theme.sym });

function fitCanvas(c) {
  const w = Math.round(c.clientWidth * dpr()), h = Math.round(c.clientHeight * dpr());
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
}

// Draw one pose on a canvas: stage colour, floor, Carles, optional grid.
function render(c, pose, unit, opts = {}) {
  const ctx = c.getContext('2d');
  const s = Math.max(1, Math.round(unit * dpr()));
  const gy = c.height - Math.round((opts.floor ?? 18) * dpr());
  ctx.fillStyle = theme.stage; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = theme.floor; ctx.fillRect(0, gy, c.width, c.height - gy);
  const ox = Math.round(c.width / 2) + Math.round(opts.worldX || 0) * s;
  C.draw(ctx, pose, { x: ox, y: gy, scale: s, facing: opts.facing || 1, palette: pal() });
  if (opts.grid) {
    for (let x = ox % s; x < c.width; x += s) {
      ctx.fillStyle = Math.round((x - ox) / s) % 2 === 0 ? theme.grid2 : theme.grid1;
      ctx.fillRect(x, 0, 1, c.height);
    }
    for (let y = gy % s; y < c.height; y += s) {
      ctx.fillStyle = Math.round((gy - y) / s) % 2 === 0 ? theme.grid2 : theme.grid1;
      ctx.fillRect(0, y, c.width, 1);
    }
  }
  return s;
}

// ---------- sidebar list ----------
function buildList() {
  const nav = $('list');
  nav.innerHTML = '';
  for (const g of C.GROUPS) {
    const h = document.createElement('h2'); h.textContent = g; nav.appendChild(h);
    for (const a of C.ANIMS.filter((x) => x.group === g)) {
      const b = document.createElement('button');
      b.className = 'anim-btn' + (a === state.anim ? ' active' : '');
      b.innerHTML = `<span>${a.name}</span><span class="tag">${a.loop ? 'loop' : 'once'}</span>`;
      b.onclick = () => select(a);
      nav.appendChild(b);
    }
    for (const name of C.PLANNED[g] || []) {
      const b = document.createElement('button');
      b.className = 'anim-btn'; b.disabled = true;
      b.innerHTML = `<span>${name}</span><span class="tag">soon</span>`;
      nav.appendChild(b);
    }
  }
}

function select(a) {
  state.anim = a; state.t = 0; state.worldX = 0; state.dir = 1;
  state.loop = a.loop; $('loop').checked = a.loop;
  if (!state.playing) setPlaying(true);
  store.set('carles.anim', a.id);
  buildList(); buildStrip(); markGallery();
}

// ---------- frame strip ----------
let stripCanvases = [];
function buildStrip() {
  const a = state.anim, box = $('strip');
  box.innerHTML = '';
  stripCanvases = a.marks.map((m, i) => {
    const fig = document.createElement('figure');
    const c = document.createElement('canvas');
    c.style.width = '96px'; c.style.height = '96px';
    c.title = `Frame ${i + 1} at ${m} ms`;
    c.onclick = () => { setPlaying(false); state.t = m; };
    const cap = document.createElement('figcaption');
    cap.textContent = `${i + 1} · ${m}ms`;
    fig.append(c, cap); box.appendChild(fig);
    fitCanvas(c);
    render(c, a.pose(m), 2, { floor: 10, facing: state.facing });
    return c;
  });
}
function markStrip() {
  const i = state.anim.frameAt(state.t);
  stripCanvases.forEach((c, n) => c.classList.toggle('on', n === i));
}

// ---------- gallery ----------
const thumbs = [];
function buildGallery() {
  const g = $('gallery');
  for (const a of C.ANIMS) {
    const d = document.createElement('div');
    d.className = 'thumb';
    const c = document.createElement('canvas');
    const label = document.createElement('div'); label.textContent = a.name;
    d.append(c, label); d.onclick = () => { select(a); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    g.appendChild(d);
    thumbs.push({ a, c, d });
  }
  markGallery();
}
function markGallery() { thumbs.forEach((t) => t.d.classList.toggle('active', t.a === state.anim)); }

// ---------- controls ----------
function setPlaying(on) {
  if (on && !state.loop && state.t >= state.anim.dur - 1) state.t = 0;
  state.playing = on; $('play').textContent = on ? '⏸' : '▶';
}
function step(dir) {
  setPlaying(false);
  const a = state.anim, m = a.marks;
  if (dir > 0) {
    const next = m.find((x) => x > state.t);
    const target = next === undefined ? a.dur : next;
    state.t = target - state.t > 250 ? state.t + 100 : target; // long holds step in 100 ms
    if (state.t >= a.dur) state.t = 0;
  } else {
    const prev = [...m].reverse().find((x) => x < state.t);
    if (prev === undefined) state.t = m[m.length - 1];
    else state.t = state.t - prev > 250 ? state.t - 100 : prev;
  }
}
function setFacing(f) {
  state.facing = f; $('face').textContent = f > 0 ? 'Facing →' : 'Facing ←'; buildStrip();
}
function move(n) {
  const A = C.ANIMS, i = A.indexOf(state.anim);
  select(A[(i + n + A.length) % A.length]);
}

$('play').onclick = () => setPlaying(!state.playing);
$('back').onclick = () => step(-1);
$('fwd').onclick = () => step(1);
$('restart').onclick = () => { state.t = 0; state.worldX = 0; setPlaying(true); };
$('loop').onchange = (e) => { state.loop = e.target.checked; };
$('speed').oninput = (e) => { state.speed = +e.target.value; $('speedVal').textContent = state.speed + '×'; };
$('size').value = String(state.size);
$('size').onchange = (e) => { state.size = +e.target.value; state.worldX = 0; };
$('color').oninput = (e) => { state.color = e.target.value; buildStrip(); };
$('grid').checked = state.grid;
$('grid').onchange = (e) => { state.grid = e.target.checked; };
$('face').onclick = () => setFacing(-state.facing);
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); setPlaying(!state.playing); }
  else if (k === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (k === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (k === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (k === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (k === 'g' || k === 'G') { state.grid = !state.grid; $('grid').checked = state.grid; }
  else if (k === 'f' || k === 'F') setFacing(-state.facing);
  else if (k === 'r' || k === 'R') $('restart').click();
});

// ---------- main loop ----------
let last = performance.now();
function tick(now) {
  const dt = Math.min(100, now - last); last = now;
  const a = state.anim, stage = $('stage');
  fitCanvas(stage);
  const s = Math.max(1, Math.round(state.size * dpr()));

  if (state.playing) {
    const d = dt * state.speed;
    state.t += d; state.gt += d;
    if (state.t >= a.dur) {
      if (state.loop) state.t %= a.dur;
      else { state.t = a.dur - 1; setPlaying(false); }
    }
    if (a.travel) {
      const half = stage.width / (2 * s) - 16;
      state.worldX += a.travel * (d / 1000) * state.dir * state.facing;
      if (Math.abs(state.worldX) > half) { state.worldX = Math.sign(state.worldX) * half; state.dir *= -1; }
    }
  }

  render(stage, a.pose(state.t), state.size, {
    floor: 70, grid: state.grid, worldX: state.worldX, facing: state.facing * (a.travel ? state.dir : 1),
  });
  for (const th of thumbs) {
    fitCanvas(th.c);
    render(th.c, th.a.pose(state.gt % th.a.dur), 3, { floor: 14 });
  }

  const fi = a.frameAt(state.t);
  $('info').innerHTML =
    `<span><b>${a.name}</b> · ${a.group}</span>` +
    `<span>frame <b>${fi + 1}</b> / ${a.marks.length}</span>` +
    `<span><b>${Math.floor(state.t)}</b> / ${a.dur} ms</span>` +
    `<span>${a.loop ? 'loops' : 'plays once'}${a.travel ? ' · moves across the stage' : ''}</span>`;
  markStrip();
  requestAnimationFrame(tick);
}

// ?sheet=1 shows every frame of every animation on one page (handy for reviewing poses).
function buildSheet() {
  const sheet = $('sheet');
  sheet.hidden = false;
  $('lab').hidden = true; document.querySelector('section.wide').hidden = true;
  // optional: ?only=build,groove  &unit=5
  const only = params.get('only') ? params.get('only').split(',') : null;
  const unit = +params.get('unit') || 2, cell = unit * 55;
  for (const a of C.ANIMS.filter((x) => !only || only.includes(x.id))) {
    const row = document.createElement('div'); row.className = 'sheet-row';
    row.innerHTML = `<h2>${a.group} · ${a.name} (${a.dur} ms)</h2>`;
    const strip = document.createElement('div'); strip.className = 'strip';
    row.appendChild(strip); sheet.appendChild(row); // attach first so canvases have a size
    a.marks.forEach((m, i) => {
      const fig = document.createElement('figure');
      const c = document.createElement('canvas'); c.style.width = cell + 'px'; c.style.height = cell + 'px';
      const cap = document.createElement('figcaption'); cap.textContent = `${i + 1} · ${m}ms`;
      fig.append(c, cap); strip.appendChild(fig);
      fitCanvas(c); render(c, a.pose(m + (a.marks[i + 1] ? 1 : 0)), unit, { floor: unit * 5 });
    });
  }
}

if (params.get('sheet') === '1') {
  buildSheet();
} else {
  if (!params.get('anim')) {
    const id = store.get('carles.anim'), a = C.ANIMS.find((x) => x.id === id);
    if (a) state.anim = a;
  }
  state.loop = state.anim.loop; $('loop').checked = state.loop;
  setPlaying(state.playing);
  buildList(); buildGallery(); buildStrip();
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
